<!-- MAIN APP CONTAINER -->
<div class="flex flex-col min-h-screen bg-slate-950 text-slate-100 font-sans">

  <!-- NAVIGATION HEADER -->
  <header class="bg-slate-900/80 backdrop-blur-md border-b border-slate-850 sticky top-0 z-40 px-4 md:px-8 py-3 flex justify-between items-center shadow-lg">
    <!-- Brand / Title -->
    <a routerLink="/" class="flex items-center gap-2.5 group">
      <span class="text-2xl font-black font-display tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-teal-400 to-cyan-500 uppercase title-glow">
        PokeDuel
      </span>
      <span class="px-2 py-0.5 bg-slate-800 text-slate-400 border border-slate-700/60 rounded text-[9px] font-mono tracking-widest uppercase font-bold group-hover:border-teal-500/40 transition-colors">v1.0</span>
    </a>

    <!-- Nav Links (Desktop) -->
    <nav class="hidden md:flex items-center gap-6 text-sm font-semibold tracking-wide">
      <a routerLink="/" routerLinkActive="text-teal-400" [routerLinkActiveOptions]="{exact: true}" 
         class="text-slate-300 hover:text-slate-100 transition-colors">
        Inicio
      </a>
      <a routerLink="/collection" routerLinkActive="text-teal-400"
         class="text-slate-300 hover:text-slate-100 transition-colors">
        Colección
      </a>
      <a routerLink="/history" routerLinkActive="text-teal-400"
         class="text-slate-300 hover:text-slate-100 transition-colors">
        Historial
      </a>
      <a routerLink="/help" routerLinkActive="text-teal-400"
         class="text-slate-300 hover:text-slate-100 transition-colors">
        Reglas
      </a>
      <a routerLink="/settings" routerLinkActive="text-teal-400"
         class="text-slate-300 hover:text-slate-100 transition-colors">
        Ajustes
      </a>
    </nav>

    <!-- User Action / Status Area -->
    <div class="flex items-center gap-3">
      <!-- Supabase Indicator -->
      <span *ngIf="!isSupabaseConfigured()" 
            class="text-[9px] font-mono font-bold bg-rose-500/10 text-rose-400 border border-rose-500/20 px-2 py-0.5 rounded flex items-center gap-1 shadow-inner cursor-pointer"
            routerLink="/settings" title="Supabase Offline - Configura en Ajustes">
        ● Local Only
      </span>
      <span *ngIf="isSupabaseConfigured() && !userProfile()" 
            class="text-[9px] font-mono font-bold bg-amber-500/10 text-amber-400 border border-amber-500/20 px-2 py-0.5 rounded flex items-center gap-1 cursor-pointer"
            routerLink="/auth" title="Sesión no iniciada">
        ● En línea
      </span>
      <span *ngIf="isSupabaseConfigured() && userProfile()" 
            class="text-[9px] font-mono font-bold bg-teal-500/10 text-teal-400 border border-teal-500/20 px-2 py-0.5 rounded flex items-center gap-1"
            title="Conectado">
        ● Servidor
      </span>

      <!-- Auth Profile widget -->
      <div *ngIf="userProfile(); else loginBtn" class="flex items-center gap-3 bg-slate-950/80 border border-slate-850 px-3 py-1.5 rounded-xl text-xs">
        <span class="font-bold text-slate-300">👋 {{ userProfile().username }}</span>
        <button (click)="handleSignOut()" class="text-rose-400 hover:text-rose-300 font-semibold border-l border-slate-800 pl-3">
          Cerrar
        </button>
      </div>

      <ng-template #loginBtn>
        <a *ngIf="isSupabaseConfigured()" routerLink="/auth" 
           class="px-4.5 py-1.5 bg-gradient-to-r from-teal-600 to-cyan-600 hover:from-teal-500 hover:to-cyan-500 text-white font-bold text-xs rounded-xl shadow-md active:scale-95 transition-all">
          LOG IN
        </a>
      </ng-template>
    </div>
  </header>

  <!-- MAIN ROUTED VIEW -->
  <main class="flex-1">
    <router-outlet></router-outlet>
  </main>

  <!-- FOOTER -->
  <footer class="bg-slate-950 border-t border-slate-900 py-6 text-center text-xs text-slate-500 font-medium">
    <div class="max-w-4xl mx-auto px-4 space-y-2">
      <p>PokeDuel © 2026 - Proyecto Integrador de Desarrollo de Aplicaciones Web</p>
      <p class="text-[10px] text-slate-600">Integración de PokeAPI, SQLite WASM local y Base de Datos Supabase</p>
    </div>
  </footer>

</div>
